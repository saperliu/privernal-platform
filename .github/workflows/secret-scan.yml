name: 密钥扫描

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # 每周一次全量扫描，覆盖历史提交里被重新翻出来的凭据
    - cron: '30 3 * * 1'

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史才能扫到早期提交里的凭据
          fetch-depth: 0

      - name: 运行 gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # 兜底规则：即使 gitleaks 规则库更新滞后，这些形态也不允许出现在工作树
      - name: 检查已知敏感形态
        run: |
          set -euo pipefail
          # PEM 头只在"独占一行"或"紧跟 base64 正文"时才算泄露；
          # 否则 SystemLoginService 里剥离 PEM 头的字符串字面量会永久误报
          patterns='LTAI[A-Za-z0-9]{12,}|MIGT[A-Za-z0-9+/=]{40,}|-----BEGIN (RSA |EC )?PRIVATE KEY-----([A-Za-z0-9+/=]{60,}|[[:space:]]*$)|AKIA[A-Z0-9]{16}|packages\.aliyun\.com/maven/repository/[0-9]+-(release|snapshot)-[A-Za-z0-9]+'
          if git grep -nIE "$patterns" -- ':!.github/workflows' ':!gitleaks.toml' > /tmp/hits; then
            echo "::error::检测到疑似真实凭据或私有制品库地址"
            cut -c1-200 /tmp/hits
            exit 1
          fi
          echo "OK：未发现已知敏感形态"
