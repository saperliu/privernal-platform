name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: 构建与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 编译、测试与打包
        # 不要加 -DskipTests：根 pom 已取消「默认跳过测试 / 忽略失败」，
        # 测试不通过就不该产出制品
        run: mvn -B -ntp clean package

      - name: 失败时归档 surefire 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore

      # 每个源文件都要带 Apache-2.0 头；漏头的新文件在这里被拦下
      - name: 检查许可头
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r f; do
            if ! head -20 "$f" | grep -q "Licensed under the Apache License, Version 2.0"; then
              echo "::error::缺少 Apache-2.0 许可头: $f"
              missing=$((missing + 1))
            fi
          done < <(git ls-files '*.java')
          echo "未通过检查的文件数: $missing"
          test "$missing" -eq 0

      # 防止把本地明文配置误提交
      - name: 检查配置文件是否入库
        run: |
          set -euo pipefail
          tracked=$(git ls-files \
            '*application-local.yaml' '*application-dev.yaml' '*.env' '*settings.xml' || true)
          if [ -n "$tracked" ]; then
            echo "::error::以下含凭据的文件不应提交进仓库:"
            echo "$tracked"
            exit 1
          fi
          echo "OK：无本地凭据文件入库"

      - name: 生成 SBOM 并归档
        run: mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
        if: github.event_name == 'push'

      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privernal-server-jar
          path: privernal-server/target/privernal-server.jar
          if-no-files-found: warn
